services:
  motomate:
    image: ghcr.io/hawkinslabdev/motomate:latest
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - TZ=Europe/Amsterdam
      - PUBLIC_APP_URL=http://localhost:3000
      - PUBLIC_APP_ORIGINS=http://localhost
      # Required. Generate with: "openssl rand -hex 32". Changing it later invalidates stored S3 and paperless credentials!
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET in a .env file, generate with openssl rand -hex 32}
      - AUTH_ALLOW_REGISTRATION=false
      - AUTH_COOKIE_SECURE=false

      # Optional. Use when configuring OIDC.
      # OIDC_ISSUER=https://idp.example.com
      # OIDC_CLIENT_ID=
      # OIDC_CLIENT_SECRET=
      # OIDC_SCOPES=openid email profile
      # OIDC_NAME=SSO    
    restart: unless-stopped

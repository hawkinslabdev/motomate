name: PR Smoke Test Docker

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - 'motomate/Dockerfile'
      - 'motomate/**'
      - '.github/workflows/docker-compose-smoke.yml'

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate .env like the README instructs
        run: echo "AUTH_SECRET=$(openssl rand -hex 32)" > .env

      - name: Build image from PR branch instead of pulling ghcr.io:latest
        run: |
          cat > docker-compose.override.yml <<'EOF'
          services:
            motomate:
              image: motomate:pr-smoke
              build:
                context: ./motomate
                dockerfile: Dockerfile
          EOF

      - name: docker compose up
        run: docker compose up -d --build

      - name: Wait for app to come up on :3000
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "app never came up"
          docker compose logs
          exit 1

      - name: Verify /login serves 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)
          if [ "$code" != "200" ]; then
            echo "expected 200 from /login, got $code"
            docker compose logs
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: docker compose down
        if: always()
        run: docker compose down -v
